    <![CDATA[
    (function() {
      var svg = document.getElementById('vae-smooth-svg');
      var crosshair = document.getElementById('vs-crosshair');
      var chDot = document.getElementById('vs-ch-dot');
      var chCenter = document.getElementById('vs-ch-center');
      var chH = document.getElementById('vs-ch-h');
      var chV = document.getElementById('vs-ch-v');
      var linkLine = document.getElementById('vs-link-line');
      var stop1 = document.getElementById('pg-stop1');
      var stop2 = document.getElementById('pg-stop2');
      var stop3 = document.getElementById('pg-stop3');
      var dragging = false;

      // Class centers for color interpolation
      var centers = [
        { x: 160, y: 130, color: [244, 63, 94] },   // rose
        { x: 400, y: 110, color: [59, 130, 246] },   // blue
        { x: 130, y: 290, color: [16, 185, 129] },   // emerald
        { x: 420, y: 310, color: [245, 158, 11] },   // amber
        { x: 280, y: 220, color: [99, 102, 241] }    // indigo
      ];

      function toSVG(evt) {
        var pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function interpolateColor(x, y) {
        var totalW = 0;
        var r = 0, g = 0, b = 0;
        for (var i = 0; i < centers.length; i++) {
          var dx = x - centers[i].x;
          var dy = y - centers[i].y;
          var dist = Math.sqrt(dx * dx + dy * dy) + 1;
          var w = 1 / (dist * dist);
          totalW += w;
          r += w * centers[i].color[0];
          g += w * centers[i].color[1];
          b += w * centers[i].color[2];
        }
        return [Math.round(r / totalW), Math.round(g / totalW), Math.round(b / totalW)];
      }

      function moveTo(x, y) {
        x = clamp(x, 60, 550);
        y = clamp(y, 55, 380);
        chDot.setAttribute('cx', x);
        chDot.setAttribute('cy', y);
        chCenter.setAttribute('cx', x);
        chCenter.setAttribute('cy', y);
        chH.setAttribute('x1', x - 20);
        chH.setAttribute('x2', x + 20);
        chH.setAttribute('y1', y);
        chH.setAttribute('y2', y);
        chV.setAttribute('x1', x);
        chV.setAttribute('x2', x);
        chV.setAttribute('y1', y - 15);
        chV.setAttribute('y2', y + 15);
        linkLine.setAttribute('x1', x + 5);
        linkLine.setAttribute('y1', y + 5);

        // Update preview color
        var c1 = interpolateColor(x - 15, y - 10);
        var c2 = interpolateColor(x, y);
        var c3 = interpolateColor(x + 15, y + 10);
        stop1.setAttribute('stop-color', 'rgb(' + c1.join(',') + ')');
        stop2.setAttribute('stop-color', 'rgb(' + c2.join(',') + ')');
        stop3.setAttribute('stop-color', 'rgb(' + c3.join(',') + ')');
      }

      crosshair.addEventListener('mousedown', function(e) {
        dragging = true;
        crosshair.style.cursor = 'grabbing';
        e.preventDefault();
      });
      svg.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var p = toSVG(e);
        moveTo(p.x, p.y);
      });
      svg.addEventListener('mouseup', function() {
        dragging = false;
        crosshair.style.cursor = 'grab';
      });
      svg.addEventListener('mouseleave', function() {
        dragging = false;
        crosshair.style.cursor = 'grab';
      });

      // Touch support
      crosshair.addEventListener('touchstart', function(e) {
        dragging = true;
        e.preventDefault();
      });
      svg.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        var p = toSVG(e.touches[0]);
        moveTo(p.x, p.y);
        e.preventDefault();
      });
      svg.addEventListener('touchend', function() { dragging = false; });
    })();
