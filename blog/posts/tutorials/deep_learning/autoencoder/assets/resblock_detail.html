```{=html}
<svg id="resblock-detail-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210"
     style="width:100%;height:auto;display:block;margin:1.5em auto;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <marker id="rb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="rb-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker>
  </defs>

  <rect width="540" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="270" y="22" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Inside a ResNet Block</text>

  <!-- Layout: input → fork → (identity top / F(x) bottom) → merge → output -->
  <!-- Identity path y=62, Transform path y=142, center y=102 -->

  <!-- Input x -->
  <rect x="20" y="82" width="40" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="107" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="600"
        font-family="'Times New Roman','Georgia',serif" font-style="italic">x</text>

  <!-- Arrow to fork -->
  <line x1="66" y1="102" x2="84" y2="102" stroke="#475569" stroke-width="1.5"/>

  <!-- Fork dot -->
  <circle cx="88" cy="102" r="3" fill="#475569"/>

  <!-- ===== IDENTITY PATH (top) ===== -->
  <line x1="88" y1="102" x2="88" y2="62" stroke="#6366f1" stroke-width="2"/>
  <line x1="88" y1="62" x2="432" y2="62" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="432" y1="62" x2="432" y2="88" stroke="#6366f1" stroke-width="2" marker-end="url(#rb-ai)"/>

  <!-- Identity label -->
  <rect x="220" y="46" width="60" height="16" rx="3" fill="#eef2ff"/>
  <text x="250" y="57" font-size="10" fill="#6366f1" text-anchor="middle" font-weight="600" font-style="italic">identity</text>

  <!-- ===== TRANSFORM PATH F(x) (bottom) ===== -->
  <line x1="88" y1="102" x2="88" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="88" y1="142" x2="108" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#rb-a)"/>

  <!-- Block 1: GN → SiLU → Conv -->
  <rect x="114" y="122" width="130" height="40" rx="5" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.5"/>
  <text x="179" y="146" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="600">GN → SiLU → Conv</text>

  <!-- Arrow between blocks -->
  <line x1="250" y1="142" x2="268" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#rb-a)"/>

  <!-- Block 2: GN → SiLU → Conv -->
  <rect x="274" y="122" width="130" height="40" rx="5" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.5"/>
  <text x="339" y="146" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="600">GN → SiLU → Conv</text>

  <!-- Arrow from block 2 up to merge -->
  <line x1="410" y1="142" x2="432" y2="142" stroke="#475569" stroke-width="1.5"/>
  <line x1="432" y1="142" x2="432" y2="116" stroke="#475569" stroke-width="1.5"/>

  <!-- F(x) label -->
  <text x="260" y="178" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">F(x)</text>

  <!-- ===== MERGE ⊕ ===== -->
  <circle cx="432" cy="102" r="13" fill="white" stroke="#6366f1" stroke-width="2"/>
  <text x="432" y="107" font-size="16" fill="#6366f1" text-anchor="middle" font-weight="700">+</text>

  <!-- Arrow to output -->
  <line x1="450" y1="102" x2="472" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#rb-a)"/>

  <!-- Output -->
  <rect x="478" y="82" width="44" height="40" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="100" font-size="10" fill="#047857" text-anchor="middle" font-weight="600"
        font-family="'Times New Roman','Georgia',serif" font-style="italic">x +</text>
  <text x="500" y="114" font-size="10" fill="#047857" text-anchor="middle" font-weight="600"
        font-family="'Times New Roman','Georgia',serif" font-style="italic">F(x)</text>

  <!-- Bottom note -->
  <text x="270" y="202" font-size="10" fill="#64748b" text-anchor="middle">The identity path lets gradients flow directly — the network only needs to learn the residual F(x)</text>
</svg>
