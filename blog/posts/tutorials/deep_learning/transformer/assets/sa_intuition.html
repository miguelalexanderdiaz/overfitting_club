<svg id="sa-intuition" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270"
     style="max-width:900px;width:100%;height:auto;display:block;margin:1em auto;">
  <defs>
    <style>
      /*
       * 10s cycle:  0-35% arcs fade in sequentially
       *            35-65% hold (strong arcs pulse)
       *            65-78% all fade out
       *            78-100% pause
       */

      /* --- per-arc fade-in/out keyframes (10s infinite) --- */
      /* arc 0: animal (strong) — in at 3%, visible 8-65%, out 78% */
      @keyframes saA0 {
        0%,3%   { opacity:0 } 8%  { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 1: The (strong) — in at 6% */
      @keyframes saA1 {
        0%,6%   { opacity:0 } 11% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 2: didn't (weak) — in at 9% */
      @keyframes saA2 {
        0%,9%   { opacity:0 } 14% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 3: cross — in at 12% */
      @keyframes saA3 {
        0%,12%  { opacity:0 } 17% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 4: the — in at 15% */
      @keyframes saA4 {
        0%,15%  { opacity:0 } 20% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 5: street (medium) — in at 18% */
      @keyframes saA5 {
        0%,18%  { opacity:0 } 23% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 6: because — in at 21% */
      @keyframes saA6 {
        0%,21%  { opacity:0 } 26% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 7: was — in at 24% */
      @keyframes saA7 {
        0%,24%  { opacity:0 } 29% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 8: too — in at 27% */
      @keyframes saA8 {
        0%,27%  { opacity:0 } 32% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* arc 9: tired (medium) — in at 30% */
      @keyframes saA9 {
        0%,30%  { opacity:0 } 35% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* label — in at 36% */
      @keyframes saLbl {
        0%,36%  { opacity:0 } 40% { opacity:1 }
        65%     { opacity:1 } 78% { opacity:0 } 100% { opacity:0 }
      }
      /* strong-arc pulse overlaid during hold phase */
      @keyframes saPulse {
        0%,35%     { stroke-width:3 }
        42%        { stroke-width:5 }
        49%        { stroke-width:3 }
        56%        { stroke-width:5 }
        63%,100%   { stroke-width:3 }
      }

      #sa-intuition .sa-a0 { animation: saA0 10s ease infinite, saPulse 10s ease infinite; }
      #sa-intuition .sa-a1 { animation: saA1 10s ease infinite, saPulse 10s ease infinite; }
      #sa-intuition .sa-a2 { animation: saA2 10s ease infinite; }
      #sa-intuition .sa-a3 { animation: saA3 10s ease infinite; }
      #sa-intuition .sa-a4 { animation: saA4 10s ease infinite; }
      #sa-intuition .sa-a5 { animation: saA5 10s ease infinite; }
      #sa-intuition .sa-a6 { animation: saA6 10s ease infinite; }
      #sa-intuition .sa-a7 { animation: saA7 10s ease infinite; }
      #sa-intuition .sa-a8 { animation: saA8 10s ease infinite; }
      #sa-intuition .sa-a9 { animation: saA9 10s ease infinite; }
      #sa-intuition .sa-label { opacity: 1; }
    </style>
  </defs>
