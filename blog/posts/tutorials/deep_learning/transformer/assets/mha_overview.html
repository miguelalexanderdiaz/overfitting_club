```{=html}
<div style="margin:1.5rem 0;">
<svg id="mha-overview" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;display:block;margin:auto;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <style>
      /* ---- wave-glow keyframes (left→right, 12s) ---- */
      @keyframes mhaGlowIn {
        0%,0%   { filter:drop-shadow(0 0 0px transparent) }
        4%      { filter:drop-shadow(0 0 10px #6366f1) }
        12%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowH1 {
        0%,10%  { filter:drop-shadow(0 0 0px transparent) }
        18%     { filter:drop-shadow(0 0 8px #f43f5e) }
        30%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowH2 {
        0%,26%  { filter:drop-shadow(0 0 0px transparent) }
        34%     { filter:drop-shadow(0 0 8px #d97706) }
        46%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowH3 {
        0%,42%  { filter:drop-shadow(0 0 0px transparent) }
        50%     { filter:drop-shadow(0 0 8px #3b82f6) }
        62%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowConcat {
        0%,58%  { filter:drop-shadow(0 0 0px transparent) }
        66%     { filter:drop-shadow(0 0 8px #6366f1) }
        78%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowWo {
        0%,74%  { filter:drop-shadow(0 0 0px transparent) }
        82%     { filter:drop-shadow(0 0 8px #334155) }
        92%     { filter:drop-shadow(0 0 0px transparent) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }
      @keyframes mhaGlowOut {
        0%,84%  { filter:drop-shadow(0 0 0px transparent) }
        92%     { filter:drop-shadow(0 0 10px #6366f1) }
        100%    { filter:drop-shadow(0 0 0px transparent) }
      }

      #mha-overview .mha-input  { animation: mhaGlowIn     12s ease infinite; }
      #mha-overview .mha-head1  { animation: mhaGlowH1     12s ease infinite; }
      #mha-overview .mha-head2  { animation: mhaGlowH2     12s ease infinite; }
      #mha-overview .mha-head3  { animation: mhaGlowH3     12s ease infinite; }
      #mha-overview .mha-concat { animation: mhaGlowConcat  12s ease infinite; }
      #mha-overview .mha-wo     { animation: mhaGlowWo     12s ease infinite; }
      #mha-overview .mha-out    { animation: mhaGlowOut    12s ease infinite; }
    </style>
    <marker id="mha-arrow" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="20" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">
    Multi-Head Attention Overview (h = 3)
  </text>

  <!-- ===== Input X ===== -->
  <g class="mha-input">
    <rect x="16" y="72" width="60" height="76" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="46" y="106" style="font:700 16px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">X</text>
    <text x="46" y="122" style="font:italic 400 9px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n×d</text>
  </g>

  <!-- Arrows from X to heads -->
  <line x1="76" y1="88"  x2="120" y2="68"  stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>
  <line x1="76" y1="110" x2="120" y2="110" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>
  <line x1="76" y1="132" x2="120" y2="152" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>

  <!-- ===== Head 1 (rose) ===== -->
  <g class="mha-head1">
    <rect x="122" y="30" width="170" height="70" rx="8"
          fill="#fff1f2" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="207" y="44" style="font:600 9px/1 'Segoe UI',system-ui,sans-serif;fill:#f43f5e;text-anchor:middle;">Head 1</text>
    <text x="170" y="64" style="font:400 9px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">W_q, W_k, W_v</text>
    <rect x="145" y="72" width="70" height="22" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
    <text x="180" y="87" style="font:600 9px/1 'Segoe UI',system-ui,sans-serif;fill:#f43f5e;text-anchor:middle;">Attention</text>
    <text x="250" y="64" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n×d_k</text>
  </g>

  <!-- ===== Head 2 (amber) ===== -->
  <g class="mha-head2">
    <rect x="122" y="105" width="170" height="70" rx="8"
          fill="#fffbeb" fill-opacity="0.4" stroke="#d97706" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="207" y="119" style="font:600 9px/1 'Segoe UI',system-ui,sans-serif;fill:#d97706;text-anchor:middle;">Head 2</text>
    <text x="170" y="139" style="font:400 9px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">W_q, W_k, W_v</text>
    <rect x="145" y="147" width="70" height="22" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="180" y="162" style="font:600 9px/1 'Segoe UI',system-ui,sans-serif;fill:#d97706;text-anchor:middle;">Attention</text>
    <text x="250" y="139" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n×d_k</text>
  </g>

  <!-- ===== Head 3 (blue) ===== -->
  <g class="mha-head3">
    <rect x="122" y="180" width="170" height="35" rx="8"
          fill="#eff6ff" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="207" y="194" style="font:600 9px/1 'Segoe UI',system-ui,sans-serif;fill:#3b82f6;text-anchor:middle;">Head 3</text>
    <text x="155" y="210" style="font:400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">W_q, W_k, W_v → Attention</text>
    <text x="260" y="210" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n×d_k</text>
  </g>

  <!-- Arrows from heads to Concat -->
  <line x1="292" y1="68"  x2="340" y2="100" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>
  <line x1="292" y1="140" x2="340" y2="115" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>
  <line x1="292" y1="198" x2="340" y2="130" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>

  <!-- ===== Concat box ===== -->
  <g class="mha-concat">
    <rect x="342" y="80" width="80" height="60" rx="8"
          fill="#eef2ff" fill-opacity="0.4" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="382" y="105" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#6366f1;text-anchor:middle;">Concat</text>
    <text x="382" y="120" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n × (h·d_k)</text>
  </g>

  <!-- Arrow Concat → W_O -->
  <line x1="422" y1="110" x2="460" y2="110" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>

  <!-- ===== W_O box ===== -->
  <g class="mha-wo">
    <rect x="462" y="85" width="68" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="496" y="108" style="font:700 13px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">W_O</text>
    <text x="496" y="124" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">d × d</text>
  </g>

  <!-- Arrow W_O → Output -->
  <line x1="530" y1="110" x2="568" y2="110" stroke="#64748b" stroke-width="1" marker-end="url(#mha-arrow)"/>

  <!-- ===== Output box ===== -->
  <g class="mha-out">
    <rect x="570" y="80" width="80" height="60" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="610" y="107" style="font:700 13px/1 'Segoe UI',system-ui,sans-serif;fill:#6366f1;text-anchor:middle;">Output</text>
    <text x="610" y="124" style="font:italic 400 8px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">n × d</text>
  </g>

  <!-- Legend -->
  <text x="450" y="210" style="font:italic 400 10px/1 'Segoe UI',system-ui,sans-serif;fill:#94a3b8;text-anchor:middle;">
    Each head applies its own Q, K, V projections · Outputs are concatenated then projected by W_O
  </text>
</svg>
</div>
```
