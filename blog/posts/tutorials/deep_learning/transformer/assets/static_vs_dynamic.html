```{=html}
<div style="margin:1.5rem 0;">
<svg id="static-vs-dynamic" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;display:block;margin:auto;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <style>
      @keyframes dynamicFlow {
        0%, 100% { stroke-width: 1.5; stroke-opacity: 0.3; filter: drop-shadow(0 0 0px transparent); }
        50% { stroke-width: 3; stroke-opacity: 1; filter: drop-shadow(0 0 6px #6366f1); }
      }
      @keyframes dynamicFlow2 {
        0%, 100% { stroke-width: 1.5; stroke-opacity: 0.3; filter: drop-shadow(0 0 0px transparent); }
        50% { stroke-width: 3; stroke-opacity: 1; filter: drop-shadow(0 0 6px #f43f5e); }
      }
      @keyframes dynamicFlow3 {
        0%, 100% { stroke-width: 1.5; stroke-opacity: 0.3; filter: drop-shadow(0 0 0px transparent); }
        50% { stroke-width: 3; stroke-opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      }
      
      .static-line { stroke: #94a3b8; stroke-width: 2; }
      
      .dyn-line-1 { animation: dynamicFlow 4s ease-in-out infinite; stroke: #818cf8; }
      .dyn-line-2 { animation: dynamicFlow2 4s ease-in-out infinite 1.33s; stroke: #fb7185; }
      .dyn-line-3 { animation: dynamicFlow3 4s ease-in-out infinite 2.66s; stroke: #34d399; }
    </style>
    <marker id="arrow-static" viewBox="0 0 10 7" refX="8" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-dyn1" viewBox="0 0 10 7" refX="8" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#818cf8"/>
    </marker>
    <marker id="arrow-dyn2" viewBox="0 0 10 7" refX="8" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-dyn3" viewBox="0 0 10 7" refX="8" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Divider -->
  <line x1="450" y1="30" x2="450" y2="290" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ===== LEFT SIDE: DNN (Static) ===== -->
  <text x="225" y="40" style="font:700 16px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">Standard DNN (Static Weights)</text>
  <text x="225" y="60" style="font:italic 400 13px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">Connections are fixed after training</text>

  <!-- Fixed Connections -->
  <g transform="translate(100,0)">
    <!-- to y1 -->
    <line x1="0" y1="225" x2="0" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="125" y1="225" x2="0" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="250" y1="225" x2="0" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    
    <!-- to y2 -->
    <line x1="0" y1="225" x2="125" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="125" y1="225" x2="125" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="250" y1="225" x2="125" y2="115" class="static-line" marker-end="url(#arrow-static)"/>

    <!-- to y3 -->
    <line x1="0" y1="225" x2="250" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="125" y1="225" x2="250" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
    <line x1="250" y1="225" x2="250" y2="115" class="static-line" marker-end="url(#arrow-static)"/>
  </g>

  <!-- Fixed Weight Matrix Box -->
  <rect x="150" y="150" width="150" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="174" style="font:700 14px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">Fixed Weights W</text>

  <!-- Input Nodes -->
  <g transform="translate(100, 240)">
    <circle cx="0" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">x₁</text>
    
    <circle cx="125" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="125" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">x₂</text>
    
    <circle cx="250" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">x₃</text>
  </g>

  <!-- Output Nodes -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="0" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">y₁</text>
    
    <circle cx="125" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="125" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">y₂</text>
    
    <circle cx="250" cy="0" r="15" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#475569;text-anchor:middle;">y₃</text>
  </g>


  <!-- ===== RIGHT SIDE: Transformer (Dynamic) ===== -->
  <text x="675" y="40" style="font:700 16px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">Transformer (Dynamic Activations)</text>
  <text x="675" y="60" style="font:italic 400 13px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">Attention weights generated on-the-fly by inputs</text>

  <!-- Dynamic Connections -->
  <g transform="translate(550,0)">
    <!-- from x1 -->
    <path d="M0,225 Q-40,170 0,115" fill="none" class="dyn-line-1" marker-end="url(#arrow-dyn1)"/>
    <path d="M0,225 Q62.5,170 125,115" fill="none" class="dyn-line-1" marker-end="url(#arrow-dyn1)"/>
    <path d="M0,225 Q125,170 250,115" fill="none" class="dyn-line-1" marker-end="url(#arrow-dyn1)"/>
    
    <!-- from x2 -->
    <path d="M125,225 Q62.5,170 0,115" fill="none" class="dyn-line-2" marker-end="url(#arrow-dyn2)"/>
    <path d="M125,225 Q165,170 125,115" fill="none" class="dyn-line-2" marker-end="url(#arrow-dyn2)"/>
    <path d="M125,225 Q187.5,170 250,115" fill="none" class="dyn-line-2" marker-end="url(#arrow-dyn2)"/>

    <!-- from x3 -->
    <path d="M250,225 Q125,170 0,115" fill="none" class="dyn-line-3" marker-end="url(#arrow-dyn3)"/>
    <path d="M250,225 Q187.5,170 125,115" fill="none" class="dyn-line-3" marker-end="url(#arrow-dyn3)"/>
    <path d="M250,225 Q290,170 250,115" fill="none" class="dyn-line-3" marker-end="url(#arrow-dyn3)"/>
  </g>

  <!-- Attention Matrix Box -->
  <rect x="600" y="150" width="150" height="40" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="675" y="174" style="font:700 14px/1 'Segoe UI',system-ui,sans-serif;fill:#4f46e5;text-anchor:middle;">Dynamic Attention A(X)</text>

  <!-- Input Nodes -->
  <g transform="translate(550, 240)">
    <circle cx="0" cy="0" r="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#4f46e5;text-anchor:middle;">x₁</text>
    
    <circle cx="125" cy="0" r="15" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="125" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#e11d48;text-anchor:middle;">x₂</text>
    
    <circle cx="250" cy="0" r="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="250" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#059669;text-anchor:middle;">x₃</text>
  </g>

  <!-- Output Nodes -->
  <g transform="translate(550, 100)">
    <circle cx="0" cy="0" r="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#4f46e5;text-anchor:middle;">h₁</text>
    
    <circle cx="125" cy="0" r="15" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="125" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#e11d48;text-anchor:middle;">h₂</text>
    
    <circle cx="250" cy="0" r="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="250" y="4" style="font:600 12px/1 'Segoe UI',system-ui,sans-serif;fill:#059669;text-anchor:middle;">h₃</text>
  </g>

</svg>
</div>
```
