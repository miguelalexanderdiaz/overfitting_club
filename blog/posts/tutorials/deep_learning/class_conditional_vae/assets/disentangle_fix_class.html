<div style="margin:1.5rem 0;">
<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg"

  <defs>
    <style>
      /* z morphs through different latent samples */
      @keyframes zMorph {
        0%, 16%   { rx: 4; ry: 4; }
        20%, 36%  { rx: 12; ry: 4; }
        40%, 56%  { rx: 4; ry: 12; }
        60%, 76%  { rx: 8; ry: 8; }
        80%, 96%  { rx: 14; ry: 6; }
        100%      { rx: 4; ry: 4; }
      }
      /* z value text cycles */
      @keyframes zVal1 { 0%, 16% { opacity: 1; } 16.1%, 100% { opacity: 0; } }
      @keyframes zVal2 { 0%, 20% { opacity: 0; } 20.1%, 36% { opacity: 1; } 36.1%, 100% { opacity: 0; } }
      @keyframes zVal3 { 0%, 40% { opacity: 0; } 40.1%, 56% { opacity: 1; } 56.1%, 100% { opacity: 0; } }
      @keyframes zVal4 { 0%, 60% { opacity: 0; } 60.1%, 76% { opacity: 1; } 76.1%, 100% { opacity: 0; } }
      @keyframes zVal5 { 0%, 80% { opacity: 0; } 80.1%, 96% { opacity: 1; } 96.1%, 100% { opacity: 0; } }
      /* Output shape varies while staying same color (same class) */
      @keyframes styleVary {
        0%, 16%   { d: path("M25,15 L55,15 L55,75 L25,75 Z"); }
        20%, 36%  { d: path("M20,20 L60,20 L55,70 L25,70 Z"); }
        40%, 56%  { d: path("M28,12 L52,12 L58,78 L22,78 Z"); }
        60%, 76%  { d: path("M22,18 L58,18 L52,72 L28,72 Z"); }
        80%, 96%  { d: path("M30,10 L50,10 L60,80 L20,80 Z"); }
        100%      { d: path("M25,15 L55,15 L55,75 L25,75 Z"); }
      }
      @keyframes lockPulse2 {
        0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
      }
      /* z block shimmer */
      @keyframes zShimmer {
        0%, 100% { fill: #fde68a; }
        25% { fill: #fbbf24; }
        50% { fill: #fcd34d; }
        75% { fill: #fef08a; }
      }
    </style>

    <text x="0" y="12" font-size="7" text-anchor="middle" fill="#92400e"

    <text x="0" y="12" font-size="7" text-anchor="middle" fill="#92400e"

  <line x1="240" y1="105" x2="280" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dc-arr)"/>

  </g>

  <!-- Explanation -->
  <g transform="translate(385, 50)">
    <text x="0" y="0" font-size="10" fill="#475569" font-weight="600">Same class</text>
    <text x="0" y="16" font-size="9" fill="#64748b">different styles:</text>
    <text x="0" y="36" font-size="9" fill="#64748b">z controls thickness,</text>
    <text x="0" y="50" font-size="9" fill="#64748b">angle, proportions</text>

    <line x1="0" y1="62" x2="100" y2="62" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="0" y="70" width="10" height="10" rx="2" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1"/>
    <text x="16" y="79" font-size="8" fill="#64748b">= locked (Sneaker)</text>
    <rect x="0" y="86" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="16" y="95" font-size="8" fill="#64748b">= changes (z resampled)</text>
  </g>

</svg>
