<div style="margin:1.5rem 0;">
<svg id="group-norm-anim" viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;display:block;margin:auto;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <style>
      /* ── Phase animations for the 4 group curves ── */
      /* Group 1 (rose): starts wide, shifted left → std → shifted left, narrower */
      @keyframes gnCurve1 {
        0%, 15%  { transform: translate(-80px, 0) scale(1.4, 0.6); }
        35%, 55% { transform: translate(0px, 0) scale(1, 1); }
        75%, 90% { transform: translate(-20px, 0) scale(0.9, 1.1); }
        100%     { transform: translate(-80px, 0) scale(1.4, 0.6); }
      }
      /* Group 2 (amber): starts narrow, shifted right → std → shifted right, wider */
      @keyframes gnCurve2 {
        0%, 15%  { transform: translate(100px, 0) scale(0.6, 1.4); }
        35%, 55% { transform: translate(0px, 0) scale(1, 1); }
        75%, 90% { transform: translate(25px, 0) scale(1.1, 0.9); }
        100%     { transform: translate(100px, 0) scale(0.6, 1.4); }
      }
      /* Group 3 (blue): starts medium, slightly left → std → near center, tall */
      @keyframes gnCurve3 {
        0%, 15%  { transform: translate(-30px, 0) scale(1.1, 0.8); }
        35%, 55% { transform: translate(0px, 0) scale(1, 1); }
        75%, 90% { transform: translate(10px, 0) scale(0.85, 1.15); }
        100%     { transform: translate(-30px, 0) scale(1.1, 0.8); }
      }
      /* Group 4 (emerald): starts tall, shifted right → std → shifted left-center, medium */
      @keyframes gnCurve4 {
        0%, 15%  { transform: translate(60px, 0) scale(0.8, 1.2); }
        35%, 55% { transform: translate(0px, 0) scale(1, 1); }
        75%, 90% { transform: translate(-10px, 0) scale(0.95, 1.05); }
        100%     { transform: translate(60px, 0) scale(0.8, 1.2); }
      }

      /* Text fades for 3-step annotation */
      @keyframes gnFade1 {
        0%, 15% { opacity: 1; } 20%, 100% { opacity: 0; }
      }
      @keyframes gnFade2 {
        0%, 30% { opacity: 0; } 35%, 55% { opacity: 1; } 60%, 100% { opacity: 0; }
      }
      @keyframes gnFade3 {
        0%, 70% { opacity: 0; } 75%, 90% { opacity: 1; } 95%, 100% { opacity: 0; }
      }

      .gn-c1 { animation: gnCurve1 12s ease-in-out infinite; }
      .gn-c2 { animation: gnCurve2 12s ease-in-out infinite; }
      .gn-c3 { animation: gnCurve3 12s ease-in-out infinite; }
      .gn-c4 { animation: gnCurve4 12s ease-in-out infinite; }
      .gn-step1 { animation: gnFade1 12s ease-in-out infinite; }
      .gn-step2 { animation: gnFade2 12s ease-in-out infinite; }
      .gn-step3 { animation: gnFade3 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="490" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="25" style="font:600 14px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">
    Group Normalization — Normalize Within Channel Groups
  </text>

  <!-- Dynamic step labels — below the plot x-axis (y=400 area) -->
  <text x="450" y="410" class="gn-step1" style="font:600 14px/1 'Segoe UI',system-ui,sans-serif;fill:#ef4444;text-anchor:middle;">
    1. Unnormalized: Each group has different mean (μ) and variance (σ²)
  </text>
  <text x="450" y="410" class="gn-step2" style="font:600 14px/1 'Segoe UI',system-ui,sans-serif;fill:#10b981;text-anchor:middle;">
    2. Standardized per group: μ = 0, σ² = 1 within each group independently
  </text>
  <text x="450" y="410" class="gn-step3" style="font:600 14px/1 'Segoe UI',system-ui,sans-serif;fill:#8b5cf6;text-anchor:middle;">
    3. Scaled &amp; Shifted: Per-channel learned γ and β fine-tune the distribution
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  CHANNEL BAR DIAGRAM — showing 8 channels / 4 groups  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(170, 70)">
    <!-- Group boundaries -->
    <!-- Group 1: ch 0-1 (rose) -->
    <rect x="0" y="0" width="120" height="30" rx="4" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="30" y="20" style="font:600 10px/1 monospace;fill:#be123c;text-anchor:middle;">Ch 0</text>
    <line x1="60" y1="0" x2="60" y2="30" stroke="#fda4af" stroke-width="0.8"/>

    <text x="220" y="20" style="font:600 10px/1 monospace;fill:#92400e;text-anchor:middle;">Ch 3</text>

    <!-- Group 3: ch 4-5 (blue) -->
    <rect x="260" y="0" width="120" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="290" y="20" style="font:600 10px/1 monospace;fill:#1e40af;text-anchor:middle;">Ch 4</text>
    <line x1="320" y1="0" x2="320" y2="30" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="350" y="20" style="font:600 10px/1 monospace;fill:#1e40af;text-anchor:middle;">Ch 5</text>

    <!-- Group 4: ch 6-7 (emerald) -->
    <rect x="390" y="0" width="120" height="30" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="420" y="20" style="font:600 10px/1 monospace;fill:#065f46;text-anchor:middle;">Ch 6</text>
    <line x1="450" y1="0" x2="450" y2="30" stroke="#6ee7b7" stroke-width="0.8"/>
    <text x="480" y="20" style="font:600 10px/1 monospace;fill:#065f46;text-anchor:middle;">Ch 7</text>

    <!-- Group labels -->
    <text x="60" y="50" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#f43f5e;text-anchor:middle;">Group 1</text>
    <text x="190" y="50" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#d97706;text-anchor:middle;">Group 2</text>
    <text x="320" y="50" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#3b82f6;text-anchor:middle;">Group 3</text>
    <text x="450" y="50" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#10b981;text-anchor:middle;">Group 4</text>

    <!-- Brace annotation -->
    <text x="255" y="-10" style="font:400 11px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">
      8 channels → 4 groups of 2 (one sample, all spatial positions)
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  GAUSSIAN ANIMATION — one curve per group              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(450, 370)">
    <!-- Grid -->
    <line x1="-350" y1="-40" x2="350" y2="-40" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-350" y1="-80" x2="350" y2="-80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-350" y1="-120" x2="350" y2="-120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-350" y1="-160" x2="350" y2="-160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Y Axis -->
    <line x1="0" y1="10" x2="0" y2="-175" stroke="#94a3b8" stroke-width="2"/>
    <text x="-10" y="-178" style="font:italic 400 11px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:end;">Density</text>

    <!-- X Axis -->
    <line x1="-370" y1="0" x2="370" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <text x="360" y="-12" style="font:italic 400 11px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:end;">Activation Value</text>

    <!-- Ticks -->
    <line x1="0" y1="0" x2="0" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="20" style="font:600 11px/1 monospace;fill:#334155;text-anchor:middle;">0</text>
    <line x1="-175" y1="0" x2="-175" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <text x="-175" y="20" style="font:400 11px/1 monospace;fill:#64748b;text-anchor:middle;">-1</text>
    <line x1="175" y1="0" x2="175" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <text x="175" y="20" style="font:400 11px/1 monospace;fill:#64748b;text-anchor:middle;">+1</text>

    <!-- Group 1 curve (rose) -->
    <g class="gn-c1">
      <path d="M -130,0 C -65,0 -39,-130 0,-130 C 39,-130 65,0 130,0"
            fill="#ffe4e6" fill-opacity="0.4" stroke="#f43f5e" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-130" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Group 2 curve (amber) -->
    <g class="gn-c2">
      <path d="M -130,0 C -65,0 -39,-130 0,-130 C 39,-130 65,0 130,0"
            fill="#fef3c7" fill-opacity="0.4" stroke="#d97706" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-130" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Group 3 curve (blue) -->
    <g class="gn-c3">
      <path d="M -130,0 C -65,0 -39,-130 0,-130 C 39,-130 65,0 130,0"
            fill="#dbeafe" fill-opacity="0.4" stroke="#3b82f6" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-130" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Group 4 curve (emerald) -->
    <g class="gn-c4">
      <path d="M -130,0 C -65,0 -39,-130 0,-130 C 39,-130 65,0 130,0"
            fill="#d1fae5" fill-opacity="0.4" stroke="#10b981" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-130" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 175)">
    <rect x="0" y="0" width="100" height="100" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="10" y1="20" x2="25" y2="20" stroke="#f43f5e" stroke-width="3"/>
    <text x="35" y="24" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;">Group 1</text>
    <line x1="10" y1="40" x2="25" y2="40" stroke="#d97706" stroke-width="3"/>
    <text x="35" y="44" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;">Group 2</text>
    <line x1="10" y1="60" x2="25" y2="60" stroke="#3b82f6" stroke-width="3"/>
    <text x="35" y="64" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;">Group 3</text>
    <line x1="10" y1="80" x2="25" y2="80" stroke="#10b981" stroke-width="3"/>
    <text x="35" y="84" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;">Group 4</text>
  </g>

  <!-- Equation boxes -->
  <rect x="20" y="430" width="200" height="48" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="449" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">Standardize per group:</text>
  <text x="120" y="468" style="font:400 12px/1 monospace;fill:#3b82f6;text-anchor:middle;">ẑ = (x - μ_g) / σ_g</text>

  <rect x="350" y="430" width="200" height="48" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="449" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">Scale &amp; Shift (per channel):</text>
  <text x="450" y="468" style="font:400 12px/1 monospace;fill:#8b5cf6;text-anchor:middle;">y = γ_c * ẑ + β_c</text>

  <rect x="680" y="430" width="200" height="48" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="780" y="449" style="font:600 11px/1 'Segoe UI',system-ui,sans-serif;fill:#334155;text-anchor:middle;">Key difference:</text>
  <text x="780" y="468" style="font:400 11px/1 'Segoe UI',system-ui,sans-serif;fill:#64748b;text-anchor:middle;">stats per group, affine per channel</text>

</svg>
</div>
