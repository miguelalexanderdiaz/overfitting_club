```{=html}
<div style="margin:1.5rem 0;">
<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:520px;display:block;margin:auto;font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <style>
      /* Class label cycles through 5 classes */
      @keyframes cycleClass {
        0%, 12%   { fill: #f43f5e; }
        20%, 32%  { fill: #f59e0b; }
        40%, 52%  { fill: #3b82f6; }
        60%, 72%  { fill: #10b981; }
        80%, 92%  { fill: #8b5cf6; }
        100%      { fill: #f43f5e; }
      }
      @keyframes cycleText {
        0%, 12%   { opacity: 1; }  12.1%, 100% { opacity: 0; }
      }
      @keyframes cycleText2 {
        0%, 20%   { opacity: 0; }  20.1%, 32% { opacity: 1; } 32.1%, 100% { opacity: 0; }
      }
      @keyframes cycleText3 {
        0%, 40%   { opacity: 0; }  40.1%, 52% { opacity: 1; } 52.1%, 100% { opacity: 0; }
      }
      @keyframes cycleText4 {
        0%, 60%   { opacity: 0; }  60.1%, 72% { opacity: 1; } 72.1%, 100% { opacity: 0; }
      }
      @keyframes cycleText5 {
        0%, 80%   { opacity: 0; }  80.1%, 92% { opacity: 1; } 92.1%, 100% { opacity: 0; }
      }
      /* Output silhouette morphs */
      @keyframes morphShape {
        0%, 12%   { d: path("M230,55 L270,55 L270,105 L230,105 Z"); } /* T-shirt-ish */
        20%, 32%  { d: path("M238,50 L262,50 L268,110 L232,110 Z"); } /* trouser-ish */
        40%, 52%  { d: path("M235,52 L265,52 L272,100 L228,100 Z"); } /* coat-ish */
        60%, 72%  { d: path("M232,60 L268,60 L265,108 L235,108 Z"); } /* sneaker-ish */
        80%, 92%  { d: path("M240,55 L260,55 L270,100 L230,100 Z"); } /* bag-ish */
        100%      { d: path("M230,55 L270,55 L270,105 L230,105 Z"); }
      }
      @keyframes morphColor {
        0%, 12%   { fill: #fecdd3; stroke: #f43f5e; }
        20%, 32%  { fill: #fef3c7; stroke: #f59e0b; }
        40%, 52%  { fill: #dbeafe; stroke: #3b82f6; }
        60%, 72%  { fill: #d1fae5; stroke: #10b981; }
        80%, 92%  { fill: #ede9fe; stroke: #8b5cf6; }
        100%      { fill: #fecdd3; stroke: #f43f5e; }
      }
      /* Lock icon pulse */
      @keyframes lockPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
    <marker id="dz-arr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0,0 6,2 0,4" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="520" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="260" y="22" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">
    Fix z, Vary Class
  </text>

  <!-- ── z block (FIXED — amber with lock) ── -->
  <g transform="translate(55, 65)">
    <rect x="-35" y="-20" width="70" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="0" y="2" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700"
          font-family="Georgia,serif" font-style="italic">z</text>
    <text x="0" y="17" font-size="8" fill="#92400e" text-anchor="middle">fixed</text>
    <!-- Lock icon -->
    <g transform="translate(24, -16)" style="animation: lockPulse 2s ease-in-out infinite;">
      <rect x="0" y="4" width="10" height="8" rx="1.5" fill="#92400e"/>
      <path d="M2,4 L2,1 A3,3 0 0 1 8,1 L8,4" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ── Class label (VARIES — cycling colors) ── -->
  <g transform="translate(55, 140)">
    <rect x="-35" y="-20" width="70" height="50" rx="6"
          style="animation: morphColor 10s step-end infinite;" stroke-width="1.8"/>
    <!-- Cycling class names -->
    <text x="0" y="2" font-size="11" font-weight="700" text-anchor="middle"
          style="animation: cycleText 10s step-end infinite; fill: #be123c;">T-shirt</text>
    <text x="0" y="2" font-size="11" font-weight="700" text-anchor="middle"
          style="animation: cycleText2 10s step-end infinite; fill: #92400e;">Trouser</text>
    <text x="0" y="2" font-size="11" font-weight="700" text-anchor="middle"
          style="animation: cycleText3 10s step-end infinite; fill: #1e40af;">Coat</text>
    <text x="0" y="2" font-size="11" font-weight="700" text-anchor="middle"
          style="animation: cycleText4 10s step-end infinite; fill: #065f46;">Sneaker</text>
    <text x="0" y="2" font-size="11" font-weight="700" text-anchor="middle"
          style="animation: cycleText5 10s step-end infinite; fill: #5b21b6;">Bag</text>
    <text x="0" y="17" font-size="8" fill="#64748b" text-anchor="middle">varies</text>
  </g>

  <!-- Arrows into decoder -->
  <line x1="96" y1="75" x2="150" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dz-arr)"/>
  <line x1="96" y1="140" x2="150" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dz-arr)"/>

  <!-- Decoder box -->
  <rect x="155" y="85" width="80" height="40" rx="6" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.5"/>
  <text x="195" y="109" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="600">Decoder</text>

  <!-- Arrow to output -->
  <line x1="240" y1="105" x2="280" y2="105" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dz-arr)"/>

  <!-- Output (morphing shape + color) -->
  <g transform="translate(250, 25)">
    <rect x="0" y="0" width="80" height="130" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M230,55 L270,55 L270,105 L230,105 Z" transform="translate(-210, -10)"
          style="animation: morphShape 10s step-end infinite, morphColor 10s step-end infinite;"
          stroke-width="2"/>
    <text x="40" y="145" font-size="9" fill="#64748b" text-anchor="middle">output</text>
  </g>

  <!-- Explanation -->
  <g transform="translate(380, 50)">
    <text x="0" y="0" font-size="10" fill="#475569" font-weight="600">Same style</text>
    <text x="0" y="16" font-size="9" fill="#64748b">across all classes:</text>
    <text x="0" y="36" font-size="9" fill="#64748b">z encodes the "how"</text>
    <text x="0" y="50" font-size="9" fill="#64748b">y encodes the "what"</text>

    <line x1="0" y1="62" x2="100" y2="62" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="0" y="70" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="16" y="79" font-size="8" fill="#64748b">= locked (same z)</text>
    <rect x="0" y="86" width="10" height="10" rx="2" fill="#c7d2fe" stroke="#818cf8" stroke-width="1"/>
    <text x="16" y="95" font-size="8" fill="#64748b">= changes (class cycles)</text>
  </g>

</svg>
</div>
