project:
  type: website
  output-dir: ../docs
  resources:
    - assets/dragon_theme/**

website:
  site-url: https://overfitting.club
  title: "The Overfitting Club"
  description: "Deep learning tutorials, ML engineering insights, and practical guides on transformers, diffusion models, and edge AI."
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    logo: assets/logo.svg
    search: true
    left:
      - text: "Thoughts"
        href: thoughts.qmd
      - text: "Tutorials"
        menu:
          - text: "All Tutorials"
            href: tutorials.qmd
          - text: "Deep Learning"
            href: deep_learning.qmd
      #     - text: "Agents"
      #       href: agents.qmd
      #     - text: "MLOps"
      #       href: mlops.qmd
      # - text: "Papers"
      #   href: papers.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/miguelalexanderdiaz/overfitting_club
      - icon: linkedin
        href: https://www.linkedin.com/in/miguel-chitiva/
  reader-mode: true
  bread-crumbs: true
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "2025-2026, The Overfitting Club by Miguel Chitiva Diaz"
    right:
      - icon: github
        href: https://github.com/miguelalexanderdiaz/overfitting_club
      - icon: linkedin
        href: https://www.linkedin.com/in/miguel-chitiva/
format:
  html:
    theme: [darkly, assets/dragon_theme/dragon.scss]
    css:
      - assets/styles.css
      - assets/about.css
    grid:
      body-width: 1400px
    include-after-body:
      - assets/dragon_theme/_corkboard-script.html



